name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Built, scanned (Trivy gate), pushed to GHCR and signed by the golden-path
  # reusable workflow, the only signing identity the platform's Kyverno policy
  # trusts. PRs build + scan only; main pushes and signs.
  image:
    name: Image (UI)
    needs: build
    uses: gastonhp1/secure-cicd-golden-path/.github/workflows/reusable-container.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image-name: pharmatrace-ui
      context: .
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64
