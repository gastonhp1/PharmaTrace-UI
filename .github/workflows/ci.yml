name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Built, scanned (Trivy gate), pushed to GHCR and signed by the golden-path
  # reusable workflow, the only signing identity the platform's Kyverno policy
  # trusts. PRs build + scan only; main pushes and signs.
  image:
    name: Image (UI)
    needs: build
    uses: gastonhp1/secure-cicd-golden-path/.github/workflows/reusable-container.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image-name: pharmatrace-ui
      context: .
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64

  # Pin each signed digest in the GitOps repo: the golden-path promote job
  # verifies the signature and opens an auto-merge PR per image.
  promote:
    name: Promote (UI) → local
    if: github.ref == 'refs/heads/main'
    needs: image
    uses: gastonhp1/secure-cicd-golden-path/.github/workflows/reusable-gitops-promote.yml@main
    permissions:
      contents: read
      id-token: write
      packages: read
    with:
      environment: local
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
      version: ${{ needs.image.outputs.version }}
      values-files: gitops/apps/pharmatrace/values-local.yaml
      image-path: .images.ui
      auto-merge: true
    secrets:
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
